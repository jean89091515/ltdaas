  <g id="step-details" data-pptx-bounds="64 278 1152 160" font-size="20" fill="#1E2633">
    <text x="72" y="306">月份覆盖、uid 能否跨期、</text><text x="72" y="334">APP 名录、时长分布、</text><text x="72" y="362">行为校验</text><text x="358" y="306">每期每人：属性、四类</text><text x="358" y="334">平台时长、求职渠道、</text><text x="358" y="362">停留出行、居住与工作</text><text x="358" y="390">网格、状态</text><text x="628" y="306">每期按状态 × 年龄 × 户籍</text><text x="628" y="334">× 求职渠道 × 区县汇总，</text><text x="628" y="362">拼成全期面板</text><text x="898" y="306">相邻期转移；从业段（从</text><text x="898" y="334">哪来、干多久、往哪去）；</text><text x="898" y="362">人期表；进入和退出前后</text><text x="898" y="390">各 4 期轨迹</text><g font-weight="bold" fill="#3E7CB1">
      <text x="72" y="426">→ 6 张小表</text>
      <text x="358" y="426">→ 5 张检查表</text>
      <text x="628" y="426">→ 每期 10 张、趋势 5 张</text>
      <text x="898" y="426">→ 约 20 张</text>
    </g>
