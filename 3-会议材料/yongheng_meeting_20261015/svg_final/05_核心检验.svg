<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="'Microsoft YaHei', Arial, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  <rect id="band" data-pptx-role="decoration" x="0" y="0" width="12" height="720" fill="#1B3A5C" />

  <g id="header" data-pptx-bounds="64 44 1152 96" font-weight="bold">
    <text x="64" y="66" font-size="18" fill="#3E7CB1">01 · 背景与研究问题</text>
    <text x="64" y="118" font-size="40" fill="#1B3A5C">核心问题可检验：平台工作是跳板、缓冲垫，还是陷阱</text>
  </g>

  <g id="hypotheses" data-pptx-bounds="64 168 1152 368">
    <line x1="434" y1="196" x2="434" y2="520" stroke="#D5DBE3" stroke-width="1" />
    <line x1="846" y1="196" x2="846" y2="520" stroke="#D5DBE3" stroke-width="1" />
    <g id="h-springboard">
      <rect x="64" y="176" width="340" height="6" fill="#1B3A5C" />
      <text x="64" y="240" font-size="44" font-weight="bold" fill="#1B3A5C">跳板</text>
      <text x="64" y="286" font-size="22" fill="#1E2633">边跑边找，之后回到正式岗位</text>
      <line x1="64" y1="318" x2="404" y2="318" stroke="#D5DBE3" stroke-width="1" />
      <text x="64" y="354" font-size="18" font-weight="bold" fill="#3E7CB1">数据里会看到</text>
      <text font-size="22" fill="#1E2633" x="64" y="392">跑单期间用求职 APP 的人，</text><text font-size="22" fill="#1E2633" x="64" y="424">下一期回到固定工作地的更多</text></g>
    <g id="h-buffer">
      <rect x="464" y="176" width="352" height="6" fill="#1B3A5C" />
      <text x="464" y="240" font-size="44" font-weight="bold" fill="#1B3A5C">缓冲垫</text>
      <text x="464" y="286" font-size="22" fill="#1E2633">失业后的临时收入</text>
      <line x1="464" y1="318" x2="816" y2="318" stroke="#D5DBE3" stroke-width="1" />
      <text x="464" y="354" font-size="18" font-weight="bold" fill="#3E7CB1">数据里会看到</text>
      <text font-size="22" fill="#1E2633" x="464" y="392">进入前固定工作地消失，</text><text font-size="22" fill="#1E2633" x="464" y="424">短期跑单后退出</text></g>
    <g id="h-trap">
      <rect x="876" y="176" width="340" height="6" fill="#1B3A5C" />
      <text x="876" y="240" font-size="44" font-weight="bold" fill="#1B3A5C">陷阱</text>
      <text x="876" y="286" font-size="22" fill="#1E2633">跑得越久越回不去</text>
      <line x1="876" y1="318" x2="1216" y2="318" stroke="#D5DBE3" stroke-width="1" />
      <text x="876" y="354" font-size="18" font-weight="bold" fill="#3E7CB1">数据里会看到</text>
      <text font-size="22" fill="#1E2633" x="876" y="392">回到固定岗位的概率</text><text font-size="22" fill="#1E2633" x="876" y="424">随平台工作持续期数下降</text></g>
  </g>

  <g id="age-check" data-pptx-bounds="64 560 1152 80">
    <rect x="64" y="564" width="1152" height="72" fill="#F3F5F8" />
    
  <g transform="translate(92, 584) scale(1.33333)" fill="none" stroke="#1B3A5C" stroke-width="2">
    <path d="M5 7a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
    <path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
    <path d="M21 21v-2a4 4 0 0 0 -3 -3.85" />
  </g>
    <text x="140" y="609" font-size="24" fill="#1E2633"><tspan font-weight="bold" fill="#1B3A5C">再看：</tspan>35 岁、45 岁以上的中年人是否更难回去</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 676 1152 40">
    <line x1="64" y1="680" x2="1216" y2="680" stroke="#D5DBE3" stroke-width="1" />
    <text x="64" y="704" font-size="14" fill="#5B6675">“数据里会看到”为本研究的检验思路</text>
    <text x="1216" y="704" font-size="14" fill="#5B6675" text-anchor="end">05 / 13</text>
  </g>
